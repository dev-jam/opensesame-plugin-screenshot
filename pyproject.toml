[tool.poetry]
name = "opensesame-plugin-screenshot"
version = "0.8.3"
description = "OpenSesame plugin for saving screenshots of the stimulus display and of all displays during an experiment"
authors = ["Bob Rosbag <mail@bobrosbag.nl>"]
readme = "README.md"
packages = [
    {include = "opensesame_plugins"},
]
license = "GPL-3.0-or-later"
homepage = "https://github.com/dev-jam/opensesame-plugin-screenshot"
repository = "https://github.com/dev-jam/opensesame-plugin-screenshot"

[tool.poetry.dependencies]
python = ">= 3.10"
screeninfo = ">= 0.8"
pillow = "*"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
